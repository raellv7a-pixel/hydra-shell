# Hydra role selectors are overridden per project; account routing stays global.
memory:
  backend: sharpshooter

checkpoint:
  enabled: true

compaction:
  methodOrder:
    - shake
    - snapcompact
    - remote
    - handoff
    - soft

task:
  agentCompactionThresholdOverrides:
    scout: 35000
    planner: 60000
    reviewer: 60000
    executor: 100000
    architect: 120000

modelRoles:
  tiny: "google-antigravity/gemini-3.8-flash:low"
  smol: "google-antigravity/gemini-3.8-flash:low"
  default: "openai-codex/gpt-6-luna:medium"
  task: "google-antigravity/gemini-3.8-flash:medium"
  plan: "openai-codex/gpt-6-sol:high"
  review: "openai-codex/gpt-6-sol:high"
  vision: "google-antigravity/gemini-3.8-flash:medium"
  commit: "openai-codex/gpt-6-luna:low"
  slow: "openai-codex/gpt-6-astra:medium"
