# Hydra Shell — source this file from your tmux.conf; no keybindings changed.
set -g status-style 'bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}'
set -g message-style 'bg={{colors.inverse_surface.default.hex}},fg={{colors.inverse_on_surface.default.hex}}'
set -g message-command-style 'bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}'
set -g pane-border-style 'fg={{colors.outline_variant.default.hex}}'
set -g pane-active-border-style 'fg={{colors.primary.default.hex}}'
set -g mode-style 'bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}'
set -g display-panes-colour '{{colors.on_surface_variant.default.hex}}'
set -g display-panes-active-colour '{{colors.primary.default.hex}}'
set -g status-left '#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}}] #S #[default] '
set -g status-right '#[fg={{colors.secondary.default.hex}}]%H:%M #[fg={{colors.on_surface_variant.default.hex}}]%d %b '
setw -g window-status-style 'bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}'
setw -g window-status-current-style 'bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}'
setw -g window-status-activity-style 'fg={{colors.tertiary.default.hex}}'
setw -g window-status-bell-style 'fg={{colors.error.default.hex}}'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#F '
